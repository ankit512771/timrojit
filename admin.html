<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Admin Panel - Gambling Demo</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #121212;
            color: #fff;
        }

        .main {
            padding: 20px;
            max-width: 800px;
            margin: auto;
        }

        input,
        button {
            margin: 5px 0;
            padding: 8px;
            border-radius: 5px;
            border: none;
        }

        input {
            width: 100%;
        }

        button {
            background: #4CAF50;
            color: #fff;
            cursor: pointer;
        }

        button:hover {
            background: #45a049;
        }
    </style>
</head>

<body>
    <div class="main">
        <h1>Admin Panel 🛠️</h1>

        <!-- Admin Password -->
        <div id="adminLoginSection">
            <input type="password" id="adminPasswordInput" placeholder="Enter Admin Password">
            <button onclick="checkAdminPassword()">Login</button>
            <p id="adminLoginMessage"></p>
        </div>

        <!-- Admin Dashboard -->
        <div id="adminDashboard" style="display:none;">
            <h2>Update Player Balance</h2>
            <form id="adminForm">
                <input type="text" id="adminUID" placeholder="Enter Player UID" required>
                <input type="number" id="adminAmount" placeholder="Enter Amount (+ add / - deduct)" required>
                <button type="submit">Update Balance</button>
            </form>
            <p id="adminMessage"></p>
            <button onclick="downloadUsersJson()">Download Updated users.json</button>

            <h3>All Users</h3>
            <div id="adminUserList"></div>
        </div>
    </div>

    <script src="admin.js"></script>
</body>

</html>
